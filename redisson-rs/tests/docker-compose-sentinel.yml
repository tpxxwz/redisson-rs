services:
  redis-master:
    image: redis:7.0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis-sentinel:
    image: redis:7.0
    command: >
      sh -c "printf 'port 26379\nbind 0.0.0.0\nsentinel monitor mymaster redis-master 6379 1\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 10000\nsentinel parallel-syncs mymaster 1\n' > /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    ports:
      - "26379"
    depends_on:
      redis-master:
        condition: service_healthy
